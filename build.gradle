plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.7'
	// Docker Desktop 없이 이미지 빌드/푸시를 위한 Jib 플러그인
	id 'com.google.cloud.tools.jib' version '3.4.2'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// DB & Kafka & AWS S3
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.1.1'

	// Swagger/OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ⭕️ bootJar 태스크 디렉토리 권한 호환성 및 jar 중복 처리
tasks.named('bootJar') {
	duplicatingStrategy = DuplicatingStrategy.EXCLUDE
}

tasks.named('jar') {
	enabled = false
}

// 🚀 Jib 상세 설정 블록
jib {
	from {
		// 베이스 이미지 설정 (Java 17 런타임)
		image = 'eclipse-temurin:17-jre-jammy'
	}
	to {
		// 목표 이미지 주소 설정 (Docker Hub)
		image = 'jihoon00/scm-delivery:latest'

		auth {
			// Docker Hub 로그인 정보
			username = 'jihoon00'
			password = 'anhs12080726!'
		}
	}
	container {
		// 컨테이너 실행 시 사용할 포트
		ports = ['8080']
		// JVM 옵션
		jvmFlags = ['-Xms512m', '-Xmx1024m']
		// 생성 시간 고정 (빌드 재현성 보장)
		creationTime = 'USE_CURRENT_TIMESTAMP'
	}
}